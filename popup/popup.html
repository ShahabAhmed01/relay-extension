<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relay</title>
  <link rel="stylesheet" href="../ui/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 22 22" width="15" height="15" fill="none"><path d="M4 7C4 7 7 3 11 3C15 3 17 6 17 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M15 4L17 6L14 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M18 15C18 15 15 19 11 19C7 19 5 16 5 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M7 18L5 16L8 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="11" cy="11" r="1.5" fill="currentColor"/></svg></span>
      <span class="brand-name">Relay</span>
      <span class="brand-version" data-version></span>
    </div>
    <div class="head-actions">
      <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Open settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="body">
    <section aria-label="Current tab context">
      <div id="state-unsupported" class="empty" hidden>
        <p class="empty-title">Not an AI site</p>
        <p class="muted-2">Open a supported AI platform and Relay captures the conversation automatically.</p>
      </div>

      <div id="state-empty" class="empty" hidden>
        <p class="empty-title">Nothing captured on this tab yet</p>
        <p class="muted-2" id="empty-hint">Chat here and Relay saves it locally, in full.</p>
      </div>

      <div id="state-paused" class="empty" hidden>
        <p class="empty-title">Capture is paused</p>
        <p class="muted-2" id="paused-hint"></p>
      </div>

      <div id="state-active" hidden>
        <div class="conv-card">
          <div class="conv-top">
            <span class="conv-name" id="p-title">—</span>
          </div>
          <div class="conv-meta muted">
            <span id="p-platform"></span> · <span id="p-count"></span> · <span id="p-updated"></span>
          </div>
          <div class="conv-badges">
            <span class="badge" id="p-completeness"></span>
          </div>
          <div class="btn-row">
            <button class="btn primary" id="btn-open-panel">Open Relay panel</button>
            <button class="btn" id="btn-copy" title="Copy the full transcript as Markdown">Copy</button>
            <button class="btn" id="btn-export" title="Export this conversation as JSON">Export</button>
          </div>
        </div>
      </div>
    </section>

    <section aria-label="Recent archives">
      <div class="section-label">Recent archives</div>
      <div id="recent-list" class="recent-list"></div>
      <div id="recent-empty" class="muted-2 recent-empty" hidden>No archived conversations yet.</div>
    </section>
  </main>

  <footer class="foot">
    <button class="link-btn" id="btn-archive">Browse archive</button>
    <span class="foot-note">Local only · never uploaded</span>
  </footer>

  <script src="../browser-polyfill.js"></script>
  <script src="popup.js"></script>
</body>
</html>
