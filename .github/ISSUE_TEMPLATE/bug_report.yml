name: Bug report
description: Report a reproducible problem with Relay
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thank you for reporting a bug in Relay. Please do **not** paste conversation content, API keys, or personal data."
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Which browser and version (e.g. Chrome 138, Firefox 140)?
      placeholder: Chrome 138 on Windows 11
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Relay version
      description: Which version of the extension are you running (e.g. 2.0.0)?
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: AI platform
      description: Which platform were you using when the problem occurred (e.g. ChatGPT, Claude)?
      placeholder: ChatGPT
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the issue, including any setup.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: Any console or extension logs, with personal data removed.
    validations:
      required: false
