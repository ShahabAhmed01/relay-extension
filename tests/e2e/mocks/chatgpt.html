<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>ChatGPT Mock</title></head>
<body>
  <main id="main">
    <div data-message-author-role="user">
      <div class="whitespace-pre-wrap">What is the meaning of life?</div>
    </div>
    <div data-message-author-role="assistant">
      <div class="whitespace-pre-wrap">The meaning of life is 42.</div>
    </div>
  </main>
  <div id="prompt-textarea" contenteditable="true" role="textbox" aria-label="Send a message"></div>
</body>
</html>
